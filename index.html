<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGORÀ — Laboratorio Virtuale Acustico</title>
  
  <!-- Caratteri Tipografici Stile Easy (Esattamente 2 font):
       - Space Grotesk (Titoli/Loghi)
       - Plus Jakarta Sans (Testi/Pulsanti) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="site-body" data-theme="easy">

  <!-- Velo atmosferico di sfondo (sfumatura notturna e particelle sottili) -->
  <div class="ambient-glow-bg"></div>

  <!-- ================================================================= -->
  <!-- HEADER CENTRALE STATICO (Navigazione minimale coordinata)         -->
  <!-- ================================================================= -->
  <header class="main-header">
    <div class="header-inner">
      <!-- Logo Grafico Ufficiale AGORA a sinistra -->
      <div class="header-logo" id="navBtnLogo" title="Torna alla vista principale" role="button" tabindex="0">
        <img src="assets/logo-agora.png" alt="AGORA - Atelier sonoro per il Gioco, la Ricerca, l'Acustica" class="header-logo-img">
      </div>

      <!-- Tutte le Voci del Menu allineate a destra -->
      <nav class="nav-side nav-right">
        <button type="button" class="nav-link" id="navBtnLab">Laboratorio Virtuale</button>
        <button type="button" class="nav-link" id="navBtnPartnership">Partner</button>
        <button type="button" class="nav-link" id="navBtnCredits">Crediti</button>
        <button type="button" class="nav-link" id="navBtnPubblicazioni">Pubblicazioni</button>
        <button type="button" class="nav-link" id="navBtnTimeline">Timeline</button>
        <button type="button" class="nav-link" id="navBtnGallery">Gallery</button>
        
        <!-- Voce Audio con testo coordinato e onda SVG a 3 gobbe colorate / piatta grigia -->
        <button type="button" class="nav-link nav-audio-btn" id="btnAudioMute" title="Silenzia o attiva l'audio interattivo" aria-label="Controllo audio interattivo">
          <span class="audio-nav-text" id="audioMuteLabel">Audio Attivo</span>
          <svg class="audio-wave-icon" viewBox="0 0 42 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="iconWaveGrad" x1="0" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="30%" stop-color="#22d3ee" />
                <stop offset="65%" stop-color="#fbbf24" />
                <stop offset="100%" stop-color="#f59e0b" />
              </linearGradient>
            </defs>
            <!-- Linea piatta e grigia (visibile quando spento) -->
            <line class="wave-flat-line" x1="1" y1="9" x2="41" y2="9" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" />
            <!-- Gruppo 3 gobbe colorate (visibile quando attivo) -->
            <g class="wave-active-group">
              <line class="wave-axis-line" x1="1" y1="9" x2="41" y2="9" stroke="rgba(255,255,255,0.2)" stroke-width="0.75" />
              <!-- Cresta 1 (su), Gobba 2 (giù), Cresta 3 (su) come nella foto di riferimento -->
              <path class="wave-hump-strand strand-main" d="M 1 9 C 6 9, 8 2, 13 2 C 17 2, 19 16, 25 16 C 30 16, 33 5, 41 9" stroke="url(#iconWaveGrad)" stroke-width="1.4" stroke-linecap="round" />
              <path class="wave-hump-strand strand-sub1" d="M 1 9 C 6 9, 9 3.5, 14 3.5 C 18 3.5, 20 14.5, 26 14.5 C 31 14.5, 34 6.5, 41 9" stroke="url(#iconWaveGrad)" stroke-width="0.85" stroke-opacity="0.65" />
              <path class="wave-hump-strand strand-sub2" d="M 1 9 C 7 9, 10 5, 15 5 C 19 5, 21 13, 27 13 C 32 13, 35 8, 41 9" stroke="url(#iconWaveGrad)" stroke-width="0.7" stroke-opacity="0.4" />
            </g>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- ================================================================= -->
  <!-- PIANO UNICO INTERATTIVO: ONDE SPETTRALI CIANO / AMBRA             -->
  <!-- ================================================================= -->
  <main class="interactive-stage">
    
    <!-- Canvas SVG interattivo -->
    <div class="soundscape-canvas-container" id="soundscapeContainer">
      <svg id="soundWavesSvg" viewBox="0 0 1600 950" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradienti spettrali acustici dello STILE EASY (Ciano -> Teal -> Ambra oro) -->
          <linearGradient id="gradWaveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>

          <linearGradient id="gradWaveActive" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="35%" stop-color="#38bdf8" />
            <stop offset="70%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#fbbf24" />
          </linearGradient>

          <filter id="spectralGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <g id="wavesSceneGroup"></g>
      </svg>
    </div>

    <!-- ================================================================= -->
    <!-- VISTA PAGINA STANDARD CON IMMAGINI IN CERCHI D'ONDA               -->
    <!-- ================================================================= -->
    <div class="circular-portal-overlay" id="circularPortal" aria-hidden="true">
      
      <!-- Cerchio "Torna alla Home" identico a quelli della Home (gira, ha filamenti armonici e testo curvo) -->
      <div class="portal-back-home-widget" id="btnBackHomeWidget" role="button" tabindex="0" title="Torna alla Home (Esc)" aria-label="Torna alla Home">
        <svg id="backHomeSvg" class="back-home-svg" viewBox="0 0 160 160">
          <g id="backHomeWaveGroup"></g>
        </svg>
      </div>

      <!-- Layout Standard da Sito Normale -->
      <div class="portal-standard-layout" id="portalStandardLayout">
        
        <!-- Vista a Due Colonne (Laboratorio Fasi & Dettagli) -->
        <div class="portal-split-view" id="portalSplitView">
          
          <!-- Colonna Sinistra: Testi Editoriali e Navigazione Onde -->
          <div class="portal-text-column">
            <div class="portal-meta-category" id="portalCategory">Laboratorio Virtuale</div>
            <h1 class="portal-heading" id="portalTitle">Fase 1: Registrazione del Suono e delle Piazze</h1>
            <div class="portal-text-body" id="portalBodyText">
              <!-- Paragrafi inseriti dinamicamente -->
            </div>

            <!-- Navigazione tra le fasi con onde sonore circolari (Zero frecce) -->
            <div class="portal-phase-nav" id="portalPhaseNav">
              <button type="button" class="btn-phase-wave" id="btnPhasePrev" title="Fase precedente" aria-label="Fase precedente">
                <span class="wave-circle-icon" aria-hidden="true">
                  <span class="wave-ripple wr-1"></span>
                  <span class="wave-ripple wr-2"></span>
                  <span class="wave-ripple wr-3"></span>
                  <span class="wave-dot"></span>
                </span>
                <span class="btn-wave-label">Fase Prec.</span>
              </button>

              <!-- Indicatori armonici di avanzamento fase -->
              <div class="phase-nodes-bar" id="phaseNodesBar">
                <button type="button" class="phase-node active" data-index="0" title="Fase 1: Acquisizione 3D"></button>
                <button type="button" class="phase-node" data-index="1" title="Fase 2: Risposte ad Impulso"></button>
                <button type="button" class="phase-node" data-index="2" title="Fase 3: Armoniche Sferiche"></button>
                <button type="button" class="phase-node" data-index="3" title="Fase 4: Realtà Virtuale 6DoF"></button>
                <button type="button" class="phase-node" data-index="4" title="Fase 5: Restituzione Immersiva"></button>
              </div>

              <button type="button" class="btn-phase-wave" id="btnPhaseNext" title="Fase successiva" aria-label="Fase successiva">
                <span class="btn-wave-label">Fase Succ.</span>
                <span class="wave-circle-icon" aria-hidden="true">
                  <span class="wave-ripple wr-1"></span>
                  <span class="wave-ripple wr-2"></span>
                  <span class="wave-ripple wr-3"></span>
                  <span class="wave-dot"></span>
                </span>
              </button>
            </div>
          </div>

          <!-- Colonna Destra: Immagine Inscritta in Cerchio con Bordo Ondulato Interattivo -->
          <div class="portal-media-column" id="portalMediaColumn">
            <div class="portal-circle-media-wrapper" id="portalCircleMediaWrapper">
              <div class="portal-circle-img-mask">
                <img src="assets/gallery/image27.jpg" alt="Dettaglio fase" class="portal-circle-img" id="portalCircleImg">
              </div>
              <!-- SVG sovrapposto con i filamenti d'onda armonici della Home -->
              <svg class="portal-circle-wave-overlay" id="portalCircleWaveSvg" viewBox="0 0 380 380">
                <g id="portalMediaWaveGroup"></g>
              </svg>
            </div>
            <p class="portal-media-caption" id="portalMediaCaption"></p>
          </div>

        </div>

        <!-- Vista a Piena Pagina (Gallery Generale, Partner, Crediti, Pubblicazioni, Timeline) -->
        <div class="portal-full-view" id="portalFullView" style="display: none;">
          <div class="portal-meta-category" id="portalFullCategory">Gallery</div>
          <h1 class="portal-heading" id="portalFullTitle">Gallery del Progetto</h1>
          <div class="portal-full-body" id="portalFullBody">
            <!-- Contenuti iniettati dinamicamente -->
          </div>
        </div>

      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
